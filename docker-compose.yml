version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./trustseat.db
      - SECRET_KEY=trustseat-aicte-sih2026-secure-key-32chars
    volumes:
      - ./trustseat.db:/app/trustseat.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
